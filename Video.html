<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advertisement</title>
  <style>
    :root {
      --blood-red: #8B0000;
      --dark-red: #660000;
      --black: #121212;
      --dark-gray: #1a1a1a;
      --light-gray: #f5f5f5;
      --white: #ffffff;
      --bg-color: #121212;
      --text-color: #ffffff;
      --card-bg: #1a1a1a;
      --header-bg: #121212;
      --footer-bg: #1a1a1a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: var(--bg-color);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    
    .ad-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }
    
    video {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
    }
    
    .skip-button {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(26, 26, 26, 0.8);
      color: var(--white);
      border: 1px solid var(--blood-red);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      transition: all 0.3s ease;
      opacity: 0.9;
      backdrop-filter: blur(5px);
    }
    
    .skip-button:hover {
      background: var(--blood-red);
      opacity: 1;
    }
    
    .skip-button:disabled {
      background: rgba(26, 26, 26, 0.6);
      color: var(--light-gray);
      cursor: not-allowed;
      border-color: var(--dark-gray);
    }
    
    .progress-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
    }
    
    .progress-bar {
      height: 100%;
      background: var(--blood-red);
      width: 0%;
      transition: width 0.1s linear;
    }
    
    .ad-badge {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(139, 0, 0, 0.8);
      color: var(--white);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      backdrop-filter: blur(5px);
    }
    
    .ad-timer {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: var(--white);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
    
    /* Mobile responsiveness */
    @media (max-width: 768px) {
      .ad-container {
        max-width: 100%;
        padding: 0 10px;
      }
      
      .skip-button {
        font-size: 12px;
        padding: 6px 12px;
      }
    }
  </style>
<link rel="stylesheet" href="theme.css?v=2">
<link rel="stylesheet" href="mobile.css?v=3">
<script src="mobile.js?v=3" defer></script>
</head>
<body>
  <div class="ad-container">
    <div class="ad-badge">ADVERTISEMENT</div>
    <video id="adVideo" autoplay muted>
      <source src="https://www.pexels.com/video/a-lamborghini-car-on-the-road-7727416/" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <button class="skip-button" id="skipButton">Skip in 5s</button>
    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="ad-timer" id="adTimer">0:05</div>
  </div>

  <script>
    const video = document.getElementById('adVideo');
    const skipButton = document.getElementById('skipButton');
    const progressBar = document.getElementById('progressBar');
    const adTimer = document.getElementById('adTimer');
    
    let skipTimeRemaining = 5; // 5 seconds skip timer
    let skipInterval;
    let isSkippable = false;
    
    // Initialize the ad
    function initAd() {
      // Try to play video automatically
      video.play().catch(e => {
        console.log("Autoplay prevented:", e);
      });
      
      // Set up skip button countdown
      skipButton.disabled = true;
      skipButton.textContent = `Skip in ${skipTimeRemaining}s`;
      
      skipInterval = setInterval(() => {
        skipTimeRemaining--;
        skipButton.textContent = `Skip in ${skipTimeRemaining}s`;
        adTimer.textContent = `0:0${skipTimeRemaining}`;
        
        if (skipTimeRemaining <= 0) {
          skipButton.disabled = false;
          skipButton.textContent = "Skip Ad";
          clearInterval(skipInterval);
          isSkippable = true;
        }
      }, 1000);
      
      // Set up video progress tracking
      video.addEventListener('timeupdate', updateProgressBar);
      
      // Handle video end
      video.addEventListener('ended', () => {
        closeAd();
      });
    }
    
    // Update progress bar
    function updateProgressBar() {
      if (video.duration) {
        const progress = (video.currentTime / video.duration) * 100;
        progressBar.style.width = `${progress}%`;
      }
    }
    
    // Skip ad function
    function skipAd() {
      if (isSkippable) {
        closeAd();
      }
    }
    
    // Close ad function
    function closeAd() {
      video.pause();
      // In a real implementation, this would return to the main website
      document.body.innerHTML = `
        <div style="display: flex; justify-content: center; align-items: center; height: 100vh; background: var(--bg-color); color: var(--text-color);">
          <h2>Returning to car website...</h2>
        </div>
      `;
      
      // Simulate redirect after a short delay
      setTimeout(() => {
        alert("Ad closed. Returning to car website content.");
      
        // In a real implementation, this would be: window.location.href = "H2.html";
      }, 1000);
    }
    
    // Skip button event listener
    skipButton.addEventListener('click', skipAd);
    
    // Keyboard shortcut for skipping (Spacebar or Escape)
    document.addEventListener('keydown', (e) => {
      if ((e.code === 'Space' || e.code === 'Escape') && isSkippable) {
        skipAd();
      }
    });
    
    // Initialize when page loads
    window.addEventListener('load', initAd);
    
    // Handle page visibility changes (if user switches tabs)
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        video.pause();
      } else {
        video.play().catch(e => console.log("Playback resumed"));
      }
    });
  </script>
</body>
</html>
